<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Bài thực hành Lab 11</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #5f6368;
            margin-bottom: 30px;
        }
        .menu-list {
            list-style: none;
            padding: 0;
        }
        .menu-list li {
            margin-bottom: 15px;
        }
        .menu-list a {
            text-decoration: none;
            color: white;
            background-color: #1a73e8;
            padding: 12px 25px;
            border-radius: 8px;
            display: block;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .menu-list a:hover {
            background-color: #1557b0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 115, 232, 0.4);
        }
        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bài thực hành Lab 11</h1>
        <p>Hệ thống tin tức RSS News Reader</p>

        <ul class="menu-list">
            <li><a href="news/index.html">Xem Trang Tin Tức</a></li>
        </ul>

        </div>
    </div>

</body>
</html>
